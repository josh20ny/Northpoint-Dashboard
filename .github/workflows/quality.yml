name: Foundation quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: foundation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://foundation:ci-only-password@localhost:5432/foundation
      AUTH_PROVIDER: disabled
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @workspace/db run migrate:local
      - run: pnpm --filter @workspace/db run migrate:local
      - run: pnpm test:db
      - run: pnpm secrets:check
