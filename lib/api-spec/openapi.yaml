openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/admin/planning-center:
    get:
      operationId: getPlanningCenter
      responses:
        "200":
          description: Admin connection and sync metadata without tokens or personal records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningCenterWorkspace" }
  /v1/admin/planning-center/authorize:
    post:
      operationId: authorizePlanningCenter
      responses:
        "200":
          description: One-time OAuth URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningCenterAuthorization" }
  /v1/admin/planning-center/callback:
    get:
      operationId: completePlanningCenter
      responses:
        "303": { description: Return to integration administration }
  /v1/admin/planning-center/confirm:
    post:
      operationId: confirmPlanningCenter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanningCenterConfirmation" }
      responses:
        "204": { description: Organization confirmed and permissions checked }
  /v1/admin/planning-center/disconnect:
    post:
      operationId: disconnectPlanningCenter
      responses:
        "204": { description: Tokens revoked; history retained }
  /v1/admin/planning-center/syncs:
    post:
      operationId: startPlanningCenterSync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanningCenterSyncInput" }
      responses:
        "201":
          description: Durable sync created; advance processes one page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningCenterSync" }
  /v1/admin/planning-center/syncs/{id}/advance:
    post:
      operationId: advancePlanningCenterSync
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Page committed or retry state recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningCenterSync" }
  /v1/admin/planning-center/syncs/{id}/automation:
    post:
      operationId: setPlanningCenterAutomation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanningCenterAutomationInput" }
      responses:
        "200":
          description: Automatic processing enabled or paused; saved progress retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningCenterSync" }
  /v1/admin/planning-center/syncs/{id}/cancel:
    post:
      operationId: cancelPlanningCenterSync
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Stopped; history retained }
  /v1/admin/imports:
    get:
      operationId: listImports
      responses:
        "200":
          description: Admin-only historical batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportList"
    post:
      operationId: uploadWorkbook
      parameters:
        - { in: query, name: filename, required: true, schema: { type: string, maxLength: 180 } }
        - {
            in: query,
            name: snapshotDate,
            required: true,
            schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" },
          }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { $ref: "#/components/schemas/WorkbookBytes" }
      responses:
        "201":
          description: Immutable workbook cataloged or matching batch returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
  /v1/admin/imports/uploads:
    get:
      operationId: listImportUploads
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        "200":
          description: Admin-only upload attempt history, including unlinked originals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportUploadPage" }
  /v1/admin/imports/source:
    post:
      operationId: importProvidedWorkbook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbookSourceInput" }
      responses:
        "201":
          description: Catalog supplied legacy workbook without approving mappings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatch" }
  /v1/admin/imports/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImport
      responses:
        "200":
          description: Batch catalog and versioned mappings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /v1/admin/imports/{id}/cells:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImportCells
      parameters:
        - { in: query, name: sheet, required: true, schema: { type: string } }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, maximum: 10000, default: 1 },
          }
      responses:
        "200":
          description: Original cell values and formula caches, never evaluated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCellPage" }
  /v1/admin/imports/{id}/original:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadImportOriginal
      responses:
        "200": { description: Admin-only original XLSX attachment }
  /v1/admin/imports/{id}/state:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changeImportState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportStateInput" }
      responses:
        "204": { description: Batch withdrawn or restored; history retained }
  /v1/admin/imports/{id}/mappings:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createImportMapping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportMappingInput" }
      responses:
        "201":
          description: New draft mapping version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportMapping" }
  /v1/admin/imports/{id}/mappings/{mappingId}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: mappingId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reviewImportMapping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingReviewInput" }
      responses:
        "204": { description: "Review recorded with actor, reason and mapping version" }
  /v1/admin/imports/{id}/mappings/{mappingId}/stage:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: mappingId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: stageImportMapping
      responses:
        "204": { description: Approved mapping staged idempotently; no metrics published }
  /v1/admin/imports/{id}/mappings/{mappingId}/rows:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: mappingId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImportRows
      parameters:
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, maximum: 10000, default: 1 },
          }
      responses:
        "200":
          description: Staged rows with original date, value and lineage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRowPage" }
  /v1/admin/imports/{id}/report:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImportReport
      responses:
        "200":
          description: Weekly source comparisons, not authoritative metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
  /v1/admin/imports/{id}/reviews:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveImportWeek
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeekReviewInput" }
      responses:
        "204": { description: Approval of exact evidence snapshot; never publishes metrics }
  /v1/admin/imports/{id}/exports/{kind}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - {
          in: path,
          name: kind,
          required: true,
          schema: { type: string, enum: [mappings, errors, conflicts, weekly, report] },
        }
    get:
      operationId: exportImportReport
      responses:
        "200": { description: Protected CSV or self-contained human-readable variance report }
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current verified session or signed-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
  /login:
    get:
      operationId: login
      responses:
        "302": { description: Redirect to verified identity provider }
        "503": { description: Sign-in not configured }
  /callback:
    get:
      operationId: authCallback
      responses:
        "302": { description: Return to application }
        "403": { description: Admission denied }
  /logout:
    post:
      operationId: logout
      responses:
        "204": { description: Local session revoked }
        "403": { description: CSRF check failed }
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Verified user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401": { description: Sign-in required }
  /v1/admin/workspace:
    get:
      operationId: getAdminWorkspace
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: Admin-only configuration records, 50 per collection per page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWorkspace"
        "401": { description: Sign-in required }
        "403": { description: Admin required }
  /v1/admin/invitations:
    post:
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201": { description: Invitation reserved; no email is sent }
        "400": { description: Invalid invitation }
        "403": { description: Admin and CSRF required }
        "409": { description: Account already exists }
  /v1/admin/invitations/{id}:
    delete:
      operationId: revokeInvitation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Invitation revoked }
        "403": { description: Admin and CSRF required }
        "404": { description: Invitation not found or already consumed }
  /v1/admin/users/{id}:
    patch:
      operationId: updateAccessUser
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessUserUpdate"
      responses:
        "204": { description: Account updated and sessions revoked }
        "403": { description: Admin and CSRF required }
        "404": { description: Account not found }
        "409": { description: Last active administrator cannot be removed }
  /v1/admin/ministries:
    post:
      operationId: createMinistry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinistryInput"
      responses:
        "201": { description: Ministry created }
        "400": { description: Invalid ministry }
        "403": { description: Admin and CSRF required }
        "409": { description: Code already exists }
  /v1/admin/ministries/{id}:
    patch:
      operationId: updateMinistry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinistryInput"
      responses:
        "204": { description: Ministry updated }
        "400": { description: Invalid ministry }
        "403": { description: Admin and CSRF required }
        "404": { description: Ministry not found }
  /v1/admin/services:
    post:
      operationId: createServiceOccurrence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201": { description: Dated service created }
        "400": { description: Invalid date or ministry }
        "403": { description: Admin and CSRF required }
        "409": { description: Duplicate occurrence }
  /v1/admin/services/{id}:
    patch:
      operationId: updateServiceOccurrence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "204": { description: Dated service updated }
        "400": { description: Invalid date or ministry }
        "403": { description: Admin and CSRF required }
        "404": { description: Service not found }
  /v1/foundation:
    get:
      operationId: getFoundation
      summary: Public non-sensitive Phase 0 foundation status
      responses:
        "200":
          description: Foundation status without ministry data or identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Foundation"
  /v1/documents:
    get:
      operationId: listDocuments
      summary: Planning document index
      responses:
        "200":
          description: Public project specifications, no source datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningDocument"
  /v1/documents/{slug}:
    get:
      operationId: getDocument
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Markdown document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContent"
        "404":
          description: Unknown document
  /v1/readyz:
    get:
      operationId: getReadiness
      summary: Database connectivity and migration readiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Database or migration unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    PlanningCenterAuthorization:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    PlanningCenterConfirmation:
      type: object
      required: [accountRef]
      properties:
        accountRef: { type: string, pattern: "^[0-9]+$", maxLength: 30 }
    PlanningCenterSyncInput:
      type: object
      required: [product, mode]
      properties:
        product: { type: string, enum: [people, services, check_ins] }
        mode: { type: string, enum: [backfill, incremental] }
    PlanningCenterAutomationInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    PlanningCenterSync:
      type: object
      required: [id, product, mode, status, fetched, revised, pages, pendingPages, startedAt, finishedAt, error, retryAt, automatic, lastAutomaticAt]
      properties:
        id: { type: string, format: uuid }
        product: { type: string, enum: [people, services, check_ins] }
        mode: { type: string, enum: [backfill, incremental] }
        status: { type: string, enum: [running, retry, complete, failed, cancelled] }
        fetched: { type: integer }
        revised: { type: integer }
        pages: { type: integer }
        pendingPages: { type: integer }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        retryAt: { type: ["string", "null"] }
        automatic: { type: boolean }
        lastAutomaticAt: { type: ["string", "null"] }
    PlanningCenterConnection:
      type: object
      required: [accountRef, accountName, state, scopes, connectedBy, updatedAt, lastSuccessAt, error]
      properties:
        accountRef: { type: string }
        accountName: { type: string }
        state: { type: string, enum: [pending, connected, reconnect_required, disconnected] }
        scopes: { type: array, items: { type: string } }
        connectedBy: { type: string }
        updatedAt: { type: string }
        lastSuccessAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
    PlanningCenterWorkspace:
      type: object
      required: [configured, missingConfiguration, callbackUrl, requestedScopes, connection, syncs, sourceRecords, asOf]
      properties:
        configured: { type: boolean }
        missingConfiguration: { type: array, items: { type: string } }
        callbackUrl: { type: ["string", "null"] }
        requestedScopes: { type: array, items: { type: string } }
        connection:
          anyOf:
            - { $ref: "#/components/schemas/PlanningCenterConnection" }
            - { type: "null" }
        syncs: { type: array, items: { $ref: "#/components/schemas/PlanningCenterSync" } }
        sourceRecords: { type: integer }
        asOf: { type: string }
    WorkbookBytes: { type: string, format: binary }
    WorkbookSourceInput:
      type: object
      required: [snapshotDate]
      properties:
        snapshotDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    ImportStateInput:
      type: object
      required: [state, note]
      properties:
        state: { type: string, enum: [active, withdrawn] }
        note: { type: string, minLength: 5, maxLength: 1000 }
    ImportBatch:
      type: object
      required: [id, sha256, filename, snapshotDate, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        sha256: { type: string }
        filename: { type: string }
        snapshotDate: { type: string }
        state: { type: string, enum: [active, withdrawn] }
        createdAt: { type: string }
    ImportUploadAttempt:
      type: object
      required: [id, sha256, filename, snapshotDate, objectPath, status, storageState, failurePhase, linkedBatchId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sha256: { type: string }
        filename: { type: string }
        snapshotDate: { type: string }
        objectPath: { type: string }
        status: { type: string, enum: [pending, linked, failed] }
        storageState: { type: string, enum: [unknown, stored] }
        failurePhase: { type: ["string", "null"], enum: [storage, storage_confirmation, catalog, null] }
        linkedBatchId: { type: ["string", "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportUploadPage:
      type: object
      required: [attempts, page, hasMore]
      properties:
        attempts: { type: array, items: { $ref: "#/components/schemas/ImportUploadAttempt" } }
        page: { type: integer }
        hasMore: { type: boolean }
    ImportList:
      type: object
      required: [storageReady, batches]
      properties:
        storageReady: { type: boolean }
        batches: { type: array, items: { $ref: "#/components/schemas/ImportBatch" } }
    WorkbookSheet:
      type: object
      required: [name, state, cellCount, maxRow, formulas, externalFormulas, errors, merges]
      properties:
        name: { type: string }
        state: { type: string }
        cellCount: { type: integer }
        maxRow: { type: integer }
        formulas: { type: integer }
        externalFormulas: { type: integer }
        errors: { type: integer }
        merges: { type: array, items: { type: string } }
    ImportDetail:
      type: object
      required: [batch, dateSystem, sheets, mappings]
      properties:
        batch: { $ref: "#/components/schemas/ImportBatch" }
        dateSystem: { type: string, enum: ["1900", "1904"] }
        sheets: { type: array, items: { $ref: "#/components/schemas/WorkbookSheet" } }
        mappings: { type: array, items: { $ref: "#/components/schemas/ImportMapping" } }
    WorkbookCell:
      type: object
      required: [coordinate, row, column, type, value, formula, cachedValue, style, flags]
      properties:
        coordinate: { type: string }
        row: { type: integer }
        column: { type: string }
        type: { type: string }
        value: { type: ["string", "null"] }
        formula: { type: ["string", "null"] }
        cachedValue: { type: ["string", "null"] }
        style: { type: ["string", "null"] }
        flags: { type: array, items: { type: string } }
    ImportCellPage:
      type: object
      required: [cells, page, hasMore]
      properties:
        cells: { type: array, items: { $ref: "#/components/schemas/WorkbookCell" } }
        page: { type: integer }
        hasMore: { type: boolean }
    ImportMappingInput:
      type: object
      required:
        [
          sheet,
          valueColumn,
          dateColumn,
          startRow,
          endRow,
          target,
          unit,
          ministry,
          semantics,
          priority,
          confidence,
          legacyLabel,
        ]
      properties:
        sheet: { type: string, minLength: 1, maxLength: 100 }
        valueColumn: { type: string, pattern: "^[A-Z]{1,3}$" }
        dateColumn: { type: string, pattern: "^[A-Z]{1,3}$" }
        startRow: { type: integer, minimum: 1, maximum: 100000 }
        endRow: { type: integer, minimum: 1, maximum: 100000 }
        target: { type: string, pattern: "^[a-z][a-z0-9_]{1,99}$" }
        unit: { type: string, minLength: 1, maxLength: 80 }
        ministry: { type: string, minLength: 1, maxLength: 100 }
        semantics: { type: string, minLength: 5, maxLength: 1000 }
        priority: { type: string, minLength: 1, maxLength: 100 }
        confidence: { type: string, enum: [low, medium, high] }
        legacyLabel: { type: string, minLength: 1, maxLength: 300 }
        supersedes: { type: ["string", "null"], format: uuid }
    ImportMapping:
      type: object
      required: [id, definition, status, reviewNote, stagedCount]
      properties:
        id: { type: string, format: uuid }
        definition: { $ref: "#/components/schemas/ImportMappingInput" }
        status: { type: string, enum: [draft, approved, rejected, superseded] }
        reviewNote: { type: ["string", "null"] }
        stagedCount: { type: integer }
    MappingReviewInput:
      type: object
      required: [decision, note]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, minLength: 5, maxLength: 1000 }
    StagedImportRow:
      type: object
      required:
        [
          sourceRow,
          sheet,
          coordinate,
          dateCoordinate,
          originalDate,
          sundayDate,
          value,
          formula,
          cachedValue,
          calculationStatus,
          flags,
        ]
      properties:
        sourceRow: { type: integer }
        sheet: { type: string }
        coordinate: { type: string }
        dateCoordinate: { type: string }
        originalDate: { type: ["string", "null"] }
        sundayDate: { type: ["string", "null"] }
        value: { type: ["number", "null"] }
        formula: { type: ["string", "null"] }
        cachedValue: { type: ["string", "null"] }
        calculationStatus: { type: string }
        flags: { type: array, items: { type: string } }
    ImportRowPage:
      type: object
      required: [rows, page, hasMore]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/StagedImportRow" } }
        page: { type: integer }
        hasMore: { type: boolean }
    ImportEvidence:
      type: object
      required: [mappingId, sheet, coordinate, value, flags]
      properties:
        mappingId: { type: string }
        sheet: { type: string }
        coordinate: { type: string }
        value: { type: ["number", "null"] }
        flags: { type: array, items: { type: string } }
    ImportWeek:
      type: object
      required: [week, target, unit, ministry, evidence, variance, flags, evidenceHash, approved]
      properties:
        week: { type: string }
        target: { type: string }
        unit: { type: string }
        ministry: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/ImportEvidence" } }
        variance: { type: ["number", "null"] }
        flags: { type: array, items: { type: string } }
        evidenceHash: { type: string }
        approved: { type: boolean }
        approval:
          anyOf:
            - $ref: "#/components/schemas/ImportEvidenceReview"
            - type: "null"
    ImportReviewMethod:
      type: string
      enum: [two_source, owner_confirmed]
    ImportEvidenceReview:
      type: object
      required: [method, note, reviewedBy, reviewedAt]
      properties:
        method: { $ref: "#/components/schemas/ImportReviewMethod" }
        note: { type: string }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
    ImportReport:
      type: object
      required: [weeks, stagedRows, flaggedRows, approvedWeeks]
      properties:
        weeks: { type: array, items: { $ref: "#/components/schemas/ImportWeek" } }
        stagedRows: { type: integer }
        flaggedRows: { type: integer }
        approvedWeeks: { type: integer }
    WeekReviewInput:
      type: object
      required: [week, evidenceHash, note]
      properties:
        week: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        evidenceHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        note: { type: string, minLength: 10, maxLength: 1000 }
        method: { $ref: "#/components/schemas/ImportReviewMethod" }
        ownerConfirmed: { type: boolean }
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [staff, leadership, admin] }
    AuthState:
      type: object
      required: [user, enabled, csrfToken, expiresAt]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - { type: "null" }
        enabled: { type: boolean }
        csrfToken: { type: [string, "null"] }
        expiresAt: { type: [string, "null"] }
    InvitationInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [staff, leadership, admin] }
    Invitation:
      type: object
      required: [id, email, role, expiresAt, consumedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [staff, leadership, admin] }
        expiresAt: { type: string }
        consumedAt: { type: [string, "null"] }
        revokedAt: { type: [string, "null"] }
    AccessUserUpdate:
      type: object
      additionalProperties: false
      required: [role, status]
      properties:
        role: { type: string, enum: [staff, leadership, admin] }
        status: { type: string, enum: [active, suspended] }
    AccessUser:
      allOf:
        - $ref: "#/components/schemas/AuthUser"
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [active, suspended] }
    MinistryInput:
      type: object
      additionalProperties: false
      required: [code, name, activeFrom, activeTo]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9-]{1,59}$" }
        name: { type: string, minLength: 1, maxLength: 100 }
        activeFrom: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        activeTo: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    MinistryRecord:
      allOf:
        - $ref: "#/components/schemas/MinistryInput"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    ServiceInput:
      type: object
      additionalProperties: false
      required:
        [ministryId, serviceDate, startAt, capacity, locationRef, planExternalId, specialEventRef]
      properties:
        ministryId: { type: string, format: uuid }
        serviceDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        startAt: { type: string, format: date-time }
        capacity: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
        locationRef: { type: [string, "null"], maxLength: 100 }
        planExternalId: { type: [string, "null"], maxLength: 100 }
        specialEventRef: { type: [string, "null"], maxLength: 100 }
    ServiceRecord:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - type: object
          required: [id, timezone]
          properties:
            id: { type: string, format: uuid }
            timezone: { type: string }
    AuditRecord:
      type: object
      required: [id, actorUserId, action, targetType, targetId, outcome, timestamp]
      properties:
        id: { type: string }
        actorUserId: { type: [string, "null"] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: [string, "null"] }
        outcome: { type: string }
        timestamp: { type: string }
    AdminWorkspace:
      type: object
      required: [users, invitations, ministries, services, audit, page, hasMore, asOf, quality]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/AccessUser" } }
        invitations: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        ministries: { type: array, items: { $ref: "#/components/schemas/MinistryRecord" } }
        services: { type: array, items: { $ref: "#/components/schemas/ServiceRecord" } }
        audit: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
        page: { type: integer }
        hasMore: { type: boolean }
        asOf: { type: string }
        quality: { type: string }
    Foundation:
      type: object
      required:
        [phase, mode, timezone, weekEnding, asOf, quality, auth, database, ministries, integrations]
      properties:
        phase: { type: integer }
        mode: { type: string }
        timezone: { type: string }
        weekEnding: { type: string }
        asOf: { type: string }
        quality: { type: string }
        auth:
          type: object
          required: [enabled, provider, status]
          properties:
            enabled: { type: boolean }
            provider: { type: string }
            status: { type: string }
        database:
          $ref: "#/components/schemas/Readiness"
        ministries:
          type: array
          items:
            $ref: "#/components/schemas/MinistryPlaceholder"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationPlaceholder"
    Readiness:
      type: object
      required: [status, connectivity, migration]
      properties:
        status: { type: string }
        connectivity: { type: string }
        migration: { type: string }
    MinistryPlaceholder:
      type: object
      required: [slug, name, description, status]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
    IntegrationPlaceholder:
      type: object
      required: [id, name, purpose, status]
      properties:
        id: { type: string }
        name: { type: string }
        purpose: { type: string }
        status: { type: string }
    PlanningDocument:
      type: object
      required: [slug, title, path, category]
      properties:
        slug: { type: string }
        title: { type: string }
        path: { type: string }
        category: { type: string }
    DocumentContent:
      type: object
      required: [slug, title, path, category, content]
      properties:
        slug: { type: string }
        title: { type: string }
        path: { type: string }
        category: { type: string }
        content: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
